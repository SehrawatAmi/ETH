name: 'eth'
version: '1.0.0'
config-version: 2

profile: 'eth'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  eth:
    +materialized: table
    +tags: ['eth','crypto']
    marts:
      +tags: 
        - powerbi
        - report
      # +schema: marts
      # stablecoin_activity_per_day:
      #   +post-hook:
      #     - "grant select on {{ this }} to role ANALYST;"
      #     - "grant usage on schema dbt.dbt_sam to role tester;"

vars:
  token_name_var : 'link'
  token_address_var : '0x514910771af9ca656af840dff83e8264ecf986ca'
  token_decimals_var: 18



dispatch:
  - macro_namespace: dbt_utils
    search_order: ['eth', 'dbt_utils']