

version: 2

models:
  - name: stg_transactions
    description: Transactions in the ethereum blockchain
    columns:
      - name: hash
        description: This is the very long multiline description about the unique
          identifier of the transaction in ethereum blockchain.
        data_tests:
          - not_null
          - unique

  - name: stablecoin_activity_per_day
    config:
      contract:
        enforced: true
    columns:
      - name: date
        data_type: date
        description: ""

      - name: token_address
        data_type: varchardbt 
        description: ""

      - name: type
        data_type: varchar
        description: ""  

      - name: symbol
        data_type: varchar
        description: ""

      - name: total_usd_value
        data_type: float
        description: ""